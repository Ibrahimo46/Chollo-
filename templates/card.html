<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
:root{--bg:#FFFFFF;--red:#E5322D;--text:#1B1F2A;--gray:#5C6577;--line:#E6E8EE;--up:#1E9E5A;--down:#D93025;--gold:#B7791F}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1080px;background:var(--bg);color:var(--text);font-family:"DejaVu Sans","Noto Sans",Arial,sans-serif;position:relative;overflow:hidden}
.bar{position:absolute;left:0;top:0;bottom:0;width:20px;background:var(--red)}
.wrap{height:100%;padding:70px 80px 56px 110px;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:24px}
.logo{width:100px;height:100px;border-radius:50%;object-fit:cover}
.logo-fallback{width:100px;height:100px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:62px;font-weight:700}
.brand{font-size:46px;font-weight:700}
.badge{margin-left:auto;border:3px solid var(--red);color:#C62822;border-radius:44px;padding:12px 28px;font-size:30px}
h1{font-size:46px;font-weight:400;margin-top:80px;display:flex;align-items:center;gap:20px}
.coin{width:68px;height:68px;border-radius:50%}
.big{font-size:190px;font-weight:700;line-height:1;margin-top:34px}
.sub{font-size:44px;color:var(--gray);margin-top:34px}
.sec{font-size:32px;color:var(--gold);margin-top:44px}
.rows{margin-top:14px}
.row{display:flex;justify-content:space-between;font-size:52px;font-weight:700;padding:16px 0;border-bottom:2px solid var(--line)}
.up{color:var(--up)} .down{color:var(--down)} .gold{color:var(--gold)}
footer{margin-top:auto;display:flex;justify-content:space-between;font-size:28px;color:var(--gray)}
</style>
</head>
<body>
<div class="bar"></div>
<div class="wrap">
  <header>
    {{LOGO}}
    <div class="brand">Chollo</div>
    <div class="badge">{{BADGE}}</div>
  </header>
  {{CONTENT}}
  <footer><span>Analiza el mercado antes de operar</span><span>@CholloOficial</span></footer>
</div>
</body>
</html>
